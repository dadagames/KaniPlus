<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kani Plus</title>
<meta name="description" content="A free companion for WaniKani: find your leeches, drill them, track level-ups and accuracy, and study the common kanji WaniKani does not teach.">
<meta property="og:title" content="Kani Plus">
<meta property="og:description" content="A free companion for WaniKani: find your leeches, drill them, track level-ups and accuracy, and study the common kanji WaniKani does not teach.">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23dd0093'/%3E%3Ctext x='16' y='23' font-size='20' text-anchor='middle' fill='white' font-family='sans-serif'%3E%E8%9F%B9%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Ubuntu:wght@400;500;700&display=swap">
<style>
/* Layout: sticky tab header over a single-column workspace; WaniKani-style colored tiles and gradient action buttons. */
:root{
  --font:'Ubuntu',system-ui,-apple-system,'Segoe UI',sans-serif;
  --jp:'Noto Sans JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif;
  --bg:#eceef2;--card:#fff;--card2:#f6f7f9;--ink:#1d2129;--ink2:#555d6c;--ink3:#8790a0;--line:#dfe3ea;--head:#fff;
  --rad:#0aa6f5;--kan:#f0a;--voc:#a933f0;
  --app:#dd0093;--guru:#882d9e;--mas:#294ddb;--enl:#0093dd;--bur:#4b4f58;--lock:#c9ced8;
  --good:#13935f;--warn:#b87700;--bad:#d13b3a;
  --s1:#2a78d6;--s2:#1baf7a;--s3:#eb6834;
  --shadow:0 1px 0 rgba(0,0,0,.04),0 2px 8px rgba(20,24,40,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14151a;--card:#1e2027;--card2:#262932;--ink:#eceef3;--ink2:#a8aebb;--ink3:#7b8291;--line:#2e313b;--head:#1a1c22;
  --rad:#2cb4ff;--kan:#ff35b9;--voc:#bb5cff;--bur:#9aa0ab;--lock:#3a3e4a;
  --good:#2fc48a;--warn:#e0a21a;--bad:#ef6362;--s1:#3987e5;--s2:#199e70;--s3:#d95926;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 2px 10px rgba(0,0,0,.25);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14151a;--card:#1e2027;--card2:#262932;--ink:#eceef3;--ink2:#a8aebb;--ink3:#7b8291;--line:#2e313b;--head:#1a1c22;
  --rad:#2cb4ff;--kan:#ff35b9;--voc:#bb5cff;--bur:#9aa0ab;--lock:#3a3e4a;
  --good:#2fc48a;--warn:#e0a21a;--bad:#ef6362;--s1:#3987e5;--s2:#199e70;--s3:#d95926;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 2px 10px rgba(0,0,0,.25);color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1080px;margin:0 auto}
h1,h2,h3,h4{margin:0;font-weight:700;line-height:1.2;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--s1)}
:focus-visible{outline:2px solid var(--s1);outline-offset:2px}
.jp{font-family:var(--jp)}
.muted{color:var(--ink2)}.faint{color:var(--ink3)}
.num{font-variant-numeric:tabular-nums}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--head);border:1px solid var(--line);border-radius:12px;
  margin-top:10px;padding:8px 12px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;box-shadow:var(--shadow)}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:17px;text-decoration:none;color:var(--ink)}
.brand i{font-style:normal;font-family:var(--jp);width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:#fff;
  background:linear-gradient(135deg,#ff35b9,#a933f0);box-shadow:inset 0 -3px 0 rgba(0,0,0,.2);font-size:18px}
.tabs{display:flex;gap:2px;overflow-x:auto;flex:1 1 360px;min-width:0;scrollbar-width:none}
.tabs a{padding:7px 12px;border-radius:8px;text-decoration:none;color:var(--ink2);font-weight:500;white-space:nowrap}
.tabs a:hover{background:var(--card2)}
.tabs a[aria-current="page"]{background:var(--ink);color:var(--bg)}
.chips{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.chip{font-size:12px;padding:3px 9px;border-radius:99px;background:var(--card2);color:var(--ink2);border:1px solid var(--line);white-space:nowrap}
.chip.warn{color:var(--warn);border-color:currentColor;background:transparent}
.chip.ok{color:var(--good);border-color:currentColor;background:transparent}
main{display:flex;flex-direction:column;gap:16px;padding-top:16px}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:16px;min-width:0}
.card>header{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.card>header h3{font-size:16px}
.card>header .sub{color:var(--ink3);font-size:13px;flex:1 1 200px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.grid.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr))}
.sectionhead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sectionhead h2{font-size:20px}
.banner{border-radius:12px;padding:12px 14px;background:var(--card);border:1px solid var(--warn);color:var(--ink);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.banner b{color:var(--warn)}

/* buttons */
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 13px;font-weight:500}
.btn:hover{background:var(--card2)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:none;padding:5px 11px;font-size:13px;color:var(--ink2)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.bigs{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.big{border:0;border-radius:14px;color:#fff;text-align:left;padding:18px 20px;display:flex;align-items:center;justify-content:space-between;gap:14px;
  box-shadow:inset 0 -5px 0 rgba(0,0,0,.2),var(--shadow);min-height:92px}
.big:hover{filter:brightness(1.06)}
.big .bl{font-size:13px;opacity:.9;text-transform:uppercase;letter-spacing:.07em}
.big .bt{font-size:22px;font-weight:700;line-height:1.15}
.big .bn{font-size:40px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.big.pink{background:linear-gradient(180deg,#ff3dbd,#e0008f)}
.big.blue{background:linear-gradient(180deg,#27b3ff,#0486d6)}
.big[disabled]{filter:grayscale(.7) brightness(.9);cursor:not-allowed}

/* tiles and pills */
.tile{display:inline-grid;place-items:center;min-width:44px;height:44px;padding:0 8px;border-radius:8px;color:#fff;font-family:var(--jp);font-size:24px;line-height:1;
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.2);white-space:nowrap;flex:none}
.tile.t-r{background:var(--rad)}.tile.t-k{background:var(--kan)}.tile.t-v{background:var(--voc)}
.tile.tn{font-family:var(--font);font-size:11px;font-weight:700;max-width:72px;overflow:hidden;text-overflow:ellipsis}
.tile.lg{min-width:84px;height:84px;font-size:52px;border-radius:12px}
.tile.sm{min-width:34px;height:34px;font-size:19px;border-radius:7px}
.tile.u{background:var(--lock);color:var(--ink2);box-shadow:none}
.pill{font-size:12px;padding:2px 8px;border-radius:99px;color:#fff;white-space:nowrap}
.pill.s0{background:var(--lock);color:var(--ink2)}.pill.s1{background:var(--app)}.pill.s2{background:var(--guru)}.pill.s3{background:var(--mas)}.pill.s4{background:var(--enl)}.pill.s5{background:var(--bur)}
.pill.type-r{background:var(--rad)}.pill.type-k{background:var(--kan)}.pill.type-v{background:var(--voc)}

/* progress */
.meter{height:10px;border-radius:99px;background:var(--card2);overflow:hidden;display:flex;gap:2px}
.meter>i{display:block;height:100%;border-radius:99px}
.lvrow{display:grid;grid-template-columns:92px 1fr auto;gap:10px;align-items:center;margin-top:10px}
.lvrow .lab{display:flex;align-items:center;gap:8px;font-size:14px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.srsgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.srsbox{border-radius:10px;color:#fff;padding:10px 8px;text-align:center;box-shadow:inset 0 -4px 0 rgba(0,0,0,.2)}
.srsbox b{display:block;font-size:24px;font-variant-numeric:tabular-nums}
.srsbox span{font-size:12px;opacity:.92}
.srsbox.s1{background:var(--app)}.srsbox.s2{background:var(--guru)}.srsbox.s3{background:var(--mas)}.srsbox.s4{background:var(--enl)}.srsbox.s5{background:var(--bur)}
@media(max-width:520px){.srsgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}

/* rows */
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:9px 6px;border-top:1px solid var(--line);cursor:pointer;border-radius:8px}
.row:first-child{border-top:0}
.row:hover{background:var(--card2)}
.row .chk{display:grid;place-items:center;padding:4px}
.row .chk input{width:17px;height:17px;accent-color:var(--kan)}
.rmain{flex:1;min-width:0}
.rn{font-weight:500;overflow-wrap:anywhere}
.rr{color:var(--ink2);font-family:var(--jp);font-size:14px;overflow-wrap:anywhere}
.why{color:var(--ink3);font-size:13px}
.rside{display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-size:12px;color:var(--ink3)}
.catgrid{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.cat{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px;text-align:left}
.cat:hover{background:var(--card2)}
.cat[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.cat b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.cat span{font-size:13px;color:var(--ink2)}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tools input[type=search],.field{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0}
.field.wide{width:100%}
.selbar{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 14px;display:flex;gap:12px;align-items:center;justify-content:space-between;box-shadow:var(--shadow);z-index:5}
.selbar .btn{background:var(--kan);border-color:var(--kan);color:#fff}

/* facts */
.facts{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr))}
.fact{background:var(--card2);border-radius:10px;padding:11px 13px}
.fact b{display:block;font-size:22px;font-variant-numeric:tabular-nums;line-height:1.2}
.fact span{font-size:13px;color:var(--ink2)}
.tiles{display:flex;flex-wrap:wrap;gap:6px}
.kgrid{display:grid;gap:5px;grid-template-columns:repeat(auto-fill,minmax(44px,1fr))}
.kgrid .tile{width:100%;border:0;font-size:22px}
.kgrid .tile.k0{background:var(--card2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.kgrid .tile.k1{background:var(--app)}.kgrid .tile.k2{background:var(--guru)}.kgrid .tile.k3{background:var(--mas)}.kgrid .tile.k4{background:var(--enl)}.kgrid .tile.k5{background:var(--bur)}

/* charts */
.ch{width:100%;height:auto;display:block;touch-action:pan-y}
.ch .grid{stroke:var(--line);stroke-width:1}
.ch .ax{fill:var(--ink3);font-size:13px;font-family:var(--font)}
.ch .avg{stroke:var(--ink2);stroke-width:1.5;stroke-dasharray:4 4}
.ch .hit{fill:transparent}.ch .hit:hover{fill:var(--ink);fill-opacity:.07}
.ch .xh{stroke:var(--ink3);stroke-width:1;opacity:0}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--ink2);margin-bottom:6px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:3px;border-radius:2px;display:inline-block}
.legend i.bx{height:10px;width:10px;border-radius:3px}
.tbl{overflow-x:auto;max-height:300px;overflow-y:auto;margin-top:8px}
.tbl table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{text-align:left;padding:4px 10px;border-bottom:1px solid var(--line)}
.tbl th{color:var(--ink3);font-weight:500;position:sticky;top:0;background:var(--card)}
.mrow{display:grid;grid-template-columns:130px 1fr 52px;gap:10px;align-items:center;margin:8px 0;font-size:14px}
.mrow .meter{height:12px}
.tip{position:fixed;z-index:60;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:8px;padding:7px 10px;font-size:12.5px;max-width:240px;box-shadow:0 4px 16px rgba(0,0,0,.25)}
.tip b{font-size:14px;font-variant-numeric:tabular-nums}
.tip .tr{display:flex;gap:7px;align-items:center;margin-top:2px}
.tip .tr i{width:10px;height:3px;border-radius:2px;display:inline-block}
.tip .tt{opacity:.75;margin-bottom:2px}

/* modal */
.modal{position:fixed;inset:0;z-index:40;background:rgba(10,12,20,.55);display:grid;place-items:center;padding:16px}
.sheet{background:var(--card);border-radius:14px;max-width:560px;width:100%;max-height:calc(100% - 20px);overflow:auto;padding:18px;box-shadow:0 12px 40px rgba(0,0,0,.35)}
.sheet h3{font-size:18px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 12px;margin-top:12px;font-size:14px}
.kv dt{color:var(--ink3)}.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.mnem{white-space:pre-wrap;background:var(--card2);border-radius:10px;padding:10px 12px;font-size:14px;margin-top:10px}

/* quiz */
#quiz{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;overflow:auto}
.qwrap{max-width:720px;width:100%;margin:0 auto;display:flex;flex-direction:column;flex:1;
  padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.qtop{display:flex;align-items:center;gap:12px}
.qtop .meter{flex:1}
.qcard{margin-top:14px;border-radius:16px;color:#fff;text-align:center;padding:36px 16px;box-shadow:inset 0 -6px 0 rgba(0,0,0,.2)}
.qcard.t-r{background:var(--rad)}.qcard.t-k{background:var(--kan)}.qcard.t-v{background:var(--voc)}
.qchar{font-family:var(--jp);font-size:clamp(56px,16vw,112px);line-height:1.1;overflow-wrap:anywhere}
.qprompt{margin-top:10px;text-align:center;background:var(--ink);color:var(--bg);border-radius:10px;padding:10px;font-size:17px}
.qprompt b{text-transform:uppercase;letter-spacing:.06em}
.qform{display:flex;gap:8px;margin-top:12px}
.qform input{flex:1;min-width:0;font:inherit;font-size:22px;text-align:center;padding:14px 12px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
.qform input.ok{background:var(--good);border-color:var(--good);color:#fff}
.qform input.no{background:var(--bad);border-color:var(--bad);color:#fff}
.qform button{border:0;border-radius:12px;background:var(--ink);color:var(--bg);padding:0 20px;font-size:20px}
.qfb{margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14px}
.qfb b{font-size:16px}
.qsum{display:flex;flex-direction:column;gap:14px;margin-top:20px}

.foot{color:var(--ink3);font-size:12.5px;text-align:center;padding-top:6px}
.steps{counter-reset:s;display:flex;flex-direction:column;gap:14px}
.step{display:grid;grid-template-columns:30px 1fr;gap:12px}
.step::before{counter-increment:s;content:counter(s);width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:700;font-size:14px}
pre.code{margin:8px 0 0;background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;overflow-x:auto;font-size:12.5px;line-height:1.5;max-height:240px}
.hint{font-size:13px;color:var(--ink3);margin-top:6px}

[hidden]{display:none!important}
.check{display:flex;gap:10px;align-items:center;margin-top:12px;font-weight:600;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--kan);flex:none}

/* standalone page basics */
html{-webkit-text-size-adjust:100%}
body{margin:0}
img{max-width:100%}
textarea.field{resize:vertical;line-height:1.4}
.flabel{display:block;font-size:13px;color:var(--ink2);font-weight:500;margin-bottom:5px}
.flabel .field{margin-top:5px;font-weight:400}
.subhead{font-size:13px;color:var(--ink2);text-transform:uppercase;letter-spacing:.06em;margin:16px 0 8px;font-weight:700}
.lead{font-size:16px;color:var(--ink2);max-width:62ch;margin:8px 0 16px}
.hero h2{font-size:26px}
.linkbtn{background:none;border:0;padding:0;color:var(--s1);text-decoration:underline;font-size:inherit}
.chip .x{background:none;border:0;padding:0 0 0 4px;color:var(--ink3);font-size:15px;line-height:1}
.chip .x:hover{color:var(--bad)}
small.faint{display:block;font-size:12px;line-height:1.2;margin-top:1px}

/* source tags */
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{--c:var(--ink3);font-size:12px;line-height:1.5;padding:1px 8px;border-radius:99px;white-space:nowrap;color:var(--ink);
  background:color-mix(in srgb,var(--c) 16%,var(--card));border:1px solid color-mix(in srgb,var(--c) 50%,var(--card))}
.tag.joyo{--c:var(--s2)}.tag.freq{--c:var(--s3)}.tag.jlpt{--c:var(--s1)}.tag.name{--c:var(--ink3)}

/* extra kanji */
.intro p{max-width:70ch;color:var(--ink2);margin-top:8px}
.srclist{margin:10px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;color:var(--ink2);max-width:70ch}
.srclist .tag{margin-right:6px}
.optrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:12px}
.optrow>.muted{width:104px;flex:none}
.cat[data-act="xsrc"][aria-pressed="false"]{opacity:.55}
.cat[data-act="xsrc"] span{font-size:13px;line-height:1.3;display:block;margin-top:2px}
.cat[disabled]{opacity:.5;cursor:not-allowed}
.lesson .lhead{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.lesson h3{font-size:22px}
.why{color:var(--ink2);font-size:14px;margin-top:10px}
.row .why{margin-top:0;color:var(--ink3);font-size:13px}
.row .tags{margin-top:5px}
.okt{color:var(--good)}.bad{color:var(--bad)}
.qmeta{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;font-size:13px}
.mrow.cov{grid-template-columns:150px 1fr 82px}
@media(max-width:520px){.mrow.cov{grid-template-columns:104px 1fr 70px}.mrow{grid-template-columns:104px 1fr 48px}.optrow>.muted{width:100%}}
.qfb .field{font-size:14px}

</style>
</head>
<body>
<div class="wrap">
<header class="top">

    fa:'ふぁ',fi:'ふぃ',fe:'ふぇ',fo:'ふぉ',ja:'じゃ',ju:'じゅ',jo:'じょ',sha:'しゃ',shu:'しゅ',sho:'しょ',cha:'ちゃ',chu:'ちゅ',cho:'ちょ',
    tsa:'つぁ',she:'しぇ',che:'ちぇ',je:'じぇ',thi:'てぃ',dhi:'でぃ',wi:'うぃ',we:'うぇ'});
  for(const c of 'kgnhmrbp'){const b=rows[c][1];ROM[c+'ya']=b+'ゃ';ROM[c+'yu']=b+'ゅ';ROM[c+'yo']=b+'ょ'}
  for(const [c,b] of [['s','し'],['t','ち'],['c','ち'],['z','じ'],['j','じ'],['d','ぢ']]){ROM[c+'ya']=b+'ゃ';ROM[c+'yu']=b+'ゅ';ROM[c+'yo']=b+'ょ'}

function toKana(s,final){
  s=s.toLowerCase();let out='',i=0;
  while(i<s.length){
    const c=s[i];
    if(!/[a-z\-']/.test(c)){out+=c;i++;continue}
    if(c==='-'){out+='ー';i++;continue}
    if(c==="'"){i++;continue}
    if(i+1<s.length&&c===s[i+1]&&!'aiueon'.includes(c)){out+='っ';i++;continue}
    if(c==='n'){
      const nx=s[i+1];
      if(nx===undefined){if(final){out+='ん'}else{out+='n'}i++;continue}
      if(nx==="'"){out+='ん';i+=2;continue}
      if(nx==='n'){const n2=s[i+2];if(n2&&'aiueoy'.includes(n2)){out+='ん';i++}else{out+='ん';i+=2}continue}
      if(!'aiueoy'.includes(nx)){out+='ん';i++;continue}
    }
    let m=null;
    for(let l=4;l>=1;l--){const sub=s.substr(i,l);if(ROM[sub]){m=[ROM[sub],l];break}}
    if(m){out+=m[0];i+=m[1]}else{out+=c;i++}
  }
  return out;
}

const kata2hira=s=>s.replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60));
const normM=s=>s.toLowerCase().replace(/[’'`]/g,'').replace(/[^a-z0-9 \-]/g,' ').replace(/\s+/g,' ').trim();
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=Array.from({length:n+1},(_,i)=>i);
  for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
/* returns 2 exact, 1 close, 0 wrong */
function checkMeaning(inp,answers){
  const n=normM(inp);if(!n)return 0;let best=0;
  for(const a of answers){const m=normM(a);if(!m)continue;if(m===n)return 2;
    const tol=m.length<=4?0:m.length<=7?1:2;if(tol&&lev(n,m)<=tol)best=1}
  return best;
}
function readingSet(list){
  const set=new Set();
  for(let r of list){r=kata2hira(String(r).replace(/^!/,'')).replace(/[-\s]/g,'');
    set.add(r.replace(/\./g,''));if(r.includes('.'))set.add(r.split('.')[0])}

}
function checkReading(inp,answers){

/* ---------- WaniKani snapshot model ---------- */
function parseSnapshot(j){
  if(!j||j.v!==1||!Array.isArray(j.items))throw new Error('Unrecognised data.');
  const items=j.items.map(a=>({id:a[0],t:TY[a[1]],lv:a[2],ch:a[3],nm:a[4]||[],rd:a[5]||[],srs:a[6],mc:a[7],mi:a[8],rc:a[9],ri:a[10],mcs:a[11],rcs:a[12],next:a[13],start:a[14],passed:a[15],burned:a[16]}));
  const D={generated:j.generated,user:j.user,items,
    levels:(j.levels||[]).map(a=>({lv:a[0],unlocked:a[1],started:a[2]||a[1],passed:a[3]})),
    daily:j.daily||{},hours:j.hours||Array.from({length:7},()=>Array(24).fill(0)),levelAcc:{}};
  D.noHistory=!Object.keys(D.daily).length;
  for(const it of items){const n=it.mc+it.mi+it.rc+it.ri;if(n){const a=D.levelAcc[it.lv]||(D.levelAcc[it.lv]=[0,0]);a[0]+=n;a[1]+=it.mc+it.rc}}
  derive(D);return D;
}
function derive(D){
  D.by=new Map();D.kanjiSet=new Set();
  for(const it of D.items){
    D.by.set(it.id,it);if(it.t==='k'&&it.ch)D.kanjiSet.add(it.ch);
    it.mt=it.mc+it.mi;it.rt=it.rc+it.ri;it.inc=it.mi+it.ri;
    it.pct=(it.mt+it.rt)?Math.round(100*(it.mc+it.rc)/(it.mt+it.rt)):null;
    it.lm=it.mi/Math.pow(Math.max(it.mcs,1),1.5);
    it.lr=it.ri/Math.pow(Math.max(it.rcs,1),1.5);
    it.leech=Math.max(it.lm,it.lr);
    it.weak=it.lm>=it.lr?'meaning':'reading';
  }
  D.cats=buildCats(D);
}
const CAT_DEFS=[
  {id:'leeches',label:'Leeches',desc:'Missed often relative to how long you can keep them right. Score is mistakes divided by current streak to the power 1.5; above 1 with at least 3 mistakes counts.'},
  {id:'critical',label:'Critical condition',desc:'Overall accuracy under 75% across at least 8 answers.'},
  {id:'reading',label:'Reading trouble',desc:'Reading mistakes at least double the meaning mistakes.'},
  {id:'meaning',label:'Meaning trouble',desc:'Meaning mistakes at least double the reading mistakes.'},
  {id:'stuck',label:'Stuck in Apprentice',desc:'Started over three weeks ago and still Apprentice.'},
  {id:'almost',label:'Close to burning',desc:'Enlightened items, soonest review first.'},
  {id:'flawless',label:'Flawless',desc:'Guru or higher with at least 8 correct answers and zero mistakes.'},
  {id:'survivors',label:'Burned the hard way',desc:'Burned items that took 10 or more mistakes along the way.'}
];
function buildCats(D){
  const t=nowS(),live=D.items.filter(i=>i.srs>=1),out={};
  const f={
    leeches:()=>live.filter(i=>i.srs<9&&i.leech>1&&i.inc>=3).sort((a,b)=>b.leech-a.leech),
    critical:()=>live.filter(i=>i.srs<9&&i.pct!=null&&i.pct<75&&(i.mt+i.rt)>=8).sort((a,b)=>a.pct-b.pct),
    reading:()=>live.filter(i=>i.t!=='r'&&i.srs<9&&i.ri>=5&&i.ri>=2*Math.max(i.mi,1)).sort((a,b)=>b.ri-a.ri),
    meaning:()=>live.filter(i=>i.srs<9&&i.mi>=5&&i.mi>=2*Math.max(i.ri,1)).sort((a,b)=>b.mi-a.mi),
    stuck:()=>live.filter(i=>i.srs<=4&&i.start&&t-i.start>21*DAY).sort((a,b)=>a.start-b.start),
    almost:()=>live.filter(i=>i.srs===8&&i.next).sort((a,b)=>a.next-b.next),
    flawless:()=>live.filter(i=>i.srs>=5&&i.inc===0&&(i.mc+i.rc)>=8).sort((a,b)=>(b.mc+b.rc)-(a.mc+a.rc)),
    survivors:()=>live.filter(i=>i.srs===9&&i.inc>=10).sort((a,b)=>b.inc-a.inc)
  };
  for(const c of CAT_DEFS)out[c.id]={...c,items:f[c.id]()};
  return out;
}
function whyText(cat,it){
  const when=ts=>{const d=Math.round((ts-nowS())/DAY);return d<=0?'due now':d===1?'tomorrow':'in '+d+' days'};
  switch(cat){
    case'leeches':return 'Missed '+it.inc+' times · streak '+(it.weak==='meaning'?it.mcs:it.rcs)+' · leech score '+it.leech.toFixed(1)+' · weakest on '+it.weak;
    case'critical':return it.pct+'% correct over '+(it.mt+it.rt)+' answers';
    case'reading':return it.ri+' reading mistakes vs '+it.mi+' meaning';
    case'meaning':return it.mi+' meaning mistakes vs '+it.ri+' reading';
    case'stuck':return 'Apprentice for '+Math.round((nowS()-it.start)/DAY)+' days';
    case'almost':return 'Next review '+when(it.next);
    case'flawless':return (it.mc+it.rc)+' correct answers, no mistakes';
    case'survivors':return 'Took '+it.inc+' mistakes to burn';
  }
  return '';
}

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const SAMPLE_VOCAB=[['入口','Entrance','いりぐち',1],['大人','Adult','おとな',2],['山','Mountain','やま',2],['火曜日','Tuesday','かようび',3],['水','Water','みず',3],['今日','Today','きょう',4],['外国','Foreign Country','がいこく',4],['毎日','Every Day','まいにち',5],['友達','Friend','ともだち',5],['時間','Time','じかん',5],['先生','Teacher','せんせい',6],['学校','School','がっこう',6],['電話','Telephone','でんわ',6],['食べ物','Food','たべもの',7],['天気','Weather','てんき',7],['写真','Photograph','しゃしん',7],['図書館','Library','としょかん',8],['病院','Hospital','びょういん',8],['自転車','Bicycle','じてんしゃ',8],['春休み','Spring Break','はるやすみ',9],['開く','To Open','あく',9],['始める','To Begin','はじめる',9],['必要','Necessary','ひつよう',10],['特別','Special','とくべつ',10],['準備','Preparation','じゅんび',10],['意味','Meaning','いみ',11],['反対','Opposition','はんたい',11],['約束','Promise','やくそく',11],['緊張','Tension','きんちょう',12],['宿題','Homework','しゅくだい',12],['経験','Experience','けいけん',12],['相談','Consultation','そうだん',13],['専門','Specialty','せんもん',13],['複雑','Complicated','ふくざつ',13],['興味','Interest','きょうみ',14],['機械','Machine','きかい',14],['習慣','Habit','しゅうかん',14],['勉強','Study','べんきょう',14],['関係','Relation','かんけい',14],['不思議','Mystery','ふしぎ',14]];
function makeSample(){
  const rnd=mulberry32(11),t0=nowS(),L=14;
  const durs=[9,8,7,8,8,10,7,8,12,7,8,7,8];
  const total=durs.reduce((a,b)=>a+b,0)*DAY+13*DAY*.5;
  let cur=t0-total-4*DAY;const started=cur;const levels=[];
  for(let i=0;i<13;i++){const e=Math.floor(cur+durs[i]*DAY+rnd()*DAY);levels.push([i+1,cur,cur,e]);cur=e}
  levels.push([14,cur,cur,null]);
  const lvStart=l=>levels[l-1][1];
  const items=[];let id=1;
  const IV=[0,4,8,23,47,167,335,719,2879];
  function mkStats(s,hardM,hardR,hasR){
    if(s<=0)return[0,0,0,0,0,0];
    const reps=Math.max(2,[0,2,3,4,5,7,8,9,10,11][s]+((rnd()*3)|0));
    const mi=hardM?4+((rnd()*9)|0):((rnd()*rnd()*4)|0);
    const ri=hasR?(hardR?4+((rnd()*9)|0):((rnd()*rnd()*4)|0)):0;
    return[reps,mi,hasR?reps:0,ri,hardM?(rnd()*2|0):Math.min(reps,2+(rnd()*6|0)),hasR?(hardR?(rnd()*2|0):Math.min(reps,2+(rnd()*6|0))):0];
  }
  function push(kind,lv,ch,nm,rd){
    let s;
    if(lv>L+1)return;
    if(lv>L)s=-1;
    else{
      const age=(t0-lvStart(lv))/DAY;
      const hardM=rnd()<.035,hardR=kind!==0&&rnd()<.05;
      const base=lv===L?(rnd()<.2?0:1+((rnd()*4)|0)):age<20?5:age<60?6:age<100?7:8;
      s=lv===L?base:clamp(base+((rnd()*3)|0)-1-((hardM||hardR)?2:0),1,9);
      if(lv===L&&rnd()<.25)s=5+((rnd()*2)|0);
      const st=mkStats(s,hardM,hardR,kind!==0&&rd.length>0);
      const next=s>=1&&s<=8?t0+Math.floor((rnd()*1.2-.15)*IV[s]*HOUR):null;
      const start=s>=1?Math.floor(lvStart(lv)+rnd()*3*DAY):null;
      const passed=s>=5&&start?Math.min(t0-HOUR,Math.floor(start+(4+rnd()*6)*DAY)):null;
      const burned=s===9?Math.floor(t0-rnd()*30*DAY):null;
      items.push([id++,kind,lv,ch,nm,rd,s,...st,next,start,passed,burned]);return;
    }
    items.push([id++,kind,lv,ch,nm,rd,-1,0,0,0,0,0,0,null,null,null,null]);
  }
  const seenRad=new Set();
  for(const k of WKK){
    const [ch,lv,nm,on,kun,rads]=k;
    if(lv>L+1)continue;
    for(const r of rads||[]){if(!seenRad.has(r)){seenRad.add(r);push(0,lv,null,[r],[])}}
    push(1,lv,ch,nm,[...on,...kun]);
  }
  for(const [ch,m,r,lv] of SAMPLE_VOCAB)push(2,lv,ch,[m],[r]);
  const daily={};
  for(let i=149;i>=0;i--){
    const ts=t0-i*DAY,dow=new Date(ts*1000).getDay();
    if(rnd()<.06)continue;
    const n=Math.round((95+rnd()*120)*(dow===0||dow===6?1.25:1)*(0.75+(150-i)/150*.5));
    const acc=clamp(.83+(150-i)/150*.05+(rnd()-.5)*.08,.7,.97);
    daily[dkey(ts)]=[n,Math.round(n*acc)];
  }
  const hours=Array.from({length:7},(_,d)=>Array.from({length:24},(_,h)=>{
    const w=Math.exp(-Math.pow((h-8)/1.6,2))*1.0+Math.exp(-Math.pow((h-21)/2.2,2))*1.2+Math.exp(-Math.pow((h-13)/2,2))*.35+.03;
    return Math.round(w*(d>=5?150:110)*(.7+rnd()*.6));
  }));
  return{v:1,generated:t0,user:{name:'Demo learner',level:L,started,max_level:60},items,levels,daily,hours};
}

/* ---------- direct WaniKani connection (read-only, runs in your browser) ---------- */
const WK_BASE='https://api.wanikani.com/v2/';
const live={busy:false,msg:''};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function wkGet(url,token){
  for(let tries=0;tries<8;tries++){
    let r;
    try{r=await fetch(url,{headers:{Authorization:'Bearer '+token}})}
    catch(e){throw Object.assign(new Error('Could not reach WaniKani. Check your connection and try again.'),{code:'net'})}
    if(r.status===429){live.msg='Waiting for WaniKani rate limit…';renderChip();await sleep(15000);continue}
    if(r.status===401)throw Object.assign(new Error('WaniKani rejected that token. Check that it was copied correctly.'),{code:'auth'});
    if(!r.ok)throw new Error('WaniKani answered with error '+r.status+'.');
    return r.json();
  }
  throw new Error('WaniKani keeps rate limiting requests. Try again in a few minutes.');
}
async function* wkPages(path,token,say){
  let url=WK_BASE+path,n=0;
  while(url){
    const d=await wkGet(url,token);n++;
    if(say)say(path.split('?')[0].replace('_',' ')+', page '+n);
    for(const x of d.data)yield x;
    url=d.pages&&d.pages.next_url;
  }
}
const tsOf=s=>s?Math.floor(Date.parse(s)/1000):null;
async function fetchCore(token,say){
  const user=(await wkGet(WK_BASE+'user',token)).data;
  const KIND={radical:0,kanji:1,vocabulary:2,kana_vocabulary:2};
  const subjects=new Map();
  for await(const s of wkPages('subjects',token,say)){
    const d=s.data;if(d.hidden_at)continue;
    const nm=[...(d.meanings||[])].sort((a,b)=>(b.primary?1:0)-(a.primary?1:0)).filter(m=>m.accepted_answer).map(m=>m.meaning);
    const rd=[];for(const r of d.readings||[]){if(r.accepted_answer!==false&&!rd.includes(r.reading))rd.push(r.reading)}
    subjects.set(s.id,[s.id,KIND[s.object]??2,d.level,d.characters||null,nm,rd]);
  }
  const assign=new Map();
  for await(const a of wkPages('assignments',token,say))assign.set(a.data.subject_id,a.data);
  const stats=new Map();
  for await(const r of wkPages('review_statistics',token,say))stats.set(r.data.subject_id,r.data);
  const items=[];
  for(const [sid,base] of subjects){
    const a=assign.get(sid),st=stats.get(sid)||{};
    items.push([...base,a?a.srs_stage:-1,st.meaning_correct||0,st.meaning_incorrect||0,st.reading_correct||0,st.reading_incorrect||0,
      st.meaning_current_streak||0,st.reading_current_streak||0,a?tsOf(a.available_at):null,a?tsOf(a.started_at):null,a?tsOf(a.passed_at):null,a?tsOf(a.burned_at):null]);
  }
  const levels=[];
  for await(const p of wkPages('level_progressions',token,say)){const d=p.data;levels.push([d.level,tsOf(d.unlocked_at),tsOf(d.started_at),tsOf(d.passed_at)])}
  levels.sort((a,b)=>a[0]-b[0]);
  return{user:{name:user.username,level:user.level,started:tsOf(user.started_at),max_level:(user.subscription&&user.subscription.max_level_granted)||60},items,levels};
}
/* Review history is folded into per-day and per-hour counts as it arrives, with checkpoints, so an interrupted first load resumes. */
async function fetchReviews(token,raw,say,checkpoint){
  const through0=raw.reviewsThrough||0;let maxSeen=through0,count=0,page=0;
  let url=WK_BASE+'reviews'+(through0?'?updated_after='+encodeURIComponent(new Date(through0*1000).toISOString()):'');
  while(url){
    const d=await wkGet(url,token);page++;
    for(const r of d.data){
      const x=r.data,c=tsOf(x.created_at);if(!c||c<=through0)continue;
      if(c>maxSeen)maxSeen=c;count++;
      const ok=(x.incorrect_meaning_answers===0&&x.incorrect_reading_answers===0)?1:0,k=dkey(c),when=new Date(c*1000);
      const day=raw.daily[k]||(raw.daily[k]=[0,0]);day[0]++;day[1]+=ok;
      raw.hours[(when.getDay()+6)%7][when.getHours()]++;
    }
    raw.reviewsThrough=maxSeen;
    say('review history: '+fmtN(count)+' new reviews');
    if(page%10===0)checkpoint();
    url=d.pages&&d.pages.next_url;
  }
  checkpoint();
  return count;
}
function agoText(ts){
  if(!ts)return'';const m=Math.round((nowS()-ts)/60);
  return m<2?'just now':m<60?m+' min ago':m<48*60?Math.round(m/60)+' h ago':Math.round(m/1440)+' days ago';
}
function renderChip(){
  const chip=$('#srcchip'),btn=$('#refbtn');if(!chip)return;
  if(live.busy){chip.className='chip warn';chip.textContent=live.msg||'Updating…'}

  if(btn){btn.hidden=!S.token.trim();btn.disabled=live.busy;btn.textContent=live.busy?'Updating…':'Refresh'}

async function refreshLive(manual){
  if(live.busy)return;
  const token=S.token.trim();
  if(!token){if(manual)toast('Add your WaniKani token in Settings first.');return}
  live.busy=true;live.msg='Updating…';renderChip();
  const say=m=>{live.msg='Updating: '+m;renderChip()};
  let stage='core';
  try{
    const core=await fetchCore(token,say);
    const name=core.user.name;
    if(S.user!==name)switchUser(name);
    LS.set('last',name);
    if(typeof syncNow==='function')syncNow();
    const stored=LS.get(ukey('snap'));
    const raw={v:1,generated:nowS(),reviewsThrough:(stored&&stored.reviewsThrough)||0,user:core.user,items:core.items,levels:core.levels,
      daily:(stored&&stored.daily)||{},hours:(stored&&stored.hours)||Array.from({length:7},()=>Array(24).fill(0))};
    S.D=parseSnapshot(raw);S.raw=raw;S.source='import';S.importedAt=raw.generated;S.sel.clear();
    if(!LS.set(ukey('snap'),raw))S.storeNote='Your browser refused to store your WaniKani data, so it will be fetched again next time.';
    if(manual&&S.route==='settings')location.hash='#dashboard';
    softRender();
    stage='reviews';
    await fetchReviews(token,raw,say,()=>LS.set(ukey('snap'),raw));
    S.D=parseSnapshot(raw);S.raw=raw;
    live.busy=false;softRender();
    toast('Up to date.');
  }catch(e){
    live.busy=false;softRender();
    if(e.code==='auth')toast(e.message);
    else if(stage==='reviews')toast('Your items are up to date. Review history will finish loading on the next refresh.');
    else toast(manual?e.message:'Could not update right now. '+e.message);
  }
  live.busy=false;renderChip();
}

/* ---------- derived numbers ---------- */
function levelProgress(D){
  const L=D.user.level,out={};
  for(const t of TY){const a=D.items.filter(i=>i.lv===L&&i.t===t);out[t]={total:a.length,passed:a.filter(i=>i.srs>=5).length}}
  return out;
}
function computeStats(D){
  const days=Object.keys(D.daily).sort();
  let rev=0,ok=0;
  for(const k of days){const[n,c]=D.daily[k];rev+=n;ok+=c}
  const done=D.levels.filter(l=>l.passed&&l.started).map(l=>({lv:l.lv,d:(l.passed-l.started)/DAY}));
  const avg=done.length?done.reduce((a,b)=>a+b.d,0)/done.length:null;
  const fastest=done.length?done.reduce((a,b)=>b.d<a.d?b:a):null;
  const hrs=Array(24).fill(0);D.hours.forEach(r=>r.forEach((v,h)=>hrs[h]+=v));
  const topHour=hrs.indexOf(Math.max(...hrs));
  const unlocked=D.items.filter(i=>i.srs>=1);
  const burned=unlocked.filter(i=>i.srs===9).length;
  const most=[...unlocked].sort((a,b)=>b.inc-a.inc)[0];
  const recent=done.slice(-8);
  const pace=recent.length?recent.reduce((a,b)=>a+b.d,0)/recent.length:null;
  const maxL=D.user.max_level||60,left=maxL-D.user.level;
  const curStart=(D.levels.find(l=>l.lv===D.user.level)||{}).started;
  const eta=pace&&left>=0?nowS()+Math.max(0,left*pace*DAY-(curStart?nowS()-curStart:0)):null;
  const known=new Set(D.items.filter(i=>i.t==='k'&&i.ch&&i.srs>=5).map(i=>i.ch));
  for(const ch in S.srs)if(S.srs[ch].s>=5)known.add(ch);
  let freqKnown=0,joyoKnown=0;
  for(const ch of known){if(FREQSET.has(ch))freqKnown++;if(JOYOSET.has(ch))joyoKnown++}
  return{days,rev,ok,avg,fastest,topHour,burned,most,eta,maxL,freqKnown,joyoKnown,freqTotal:FREQSET.size,joyoTotal:JOYOSET.size};
}

  const keys=Object.keys(cnt).sort();

  const days=[];for(let i=n-1;i>=0;i--)days.push(dkey((end.getTime()-i*DAY*1000)/1000));
  const vals=days.map(k=>cnt[k]||0);
  const lab=days.map(k=>new Date(k+'T12:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short'}));
  const tips=days.map((k,i)=>({title:lab[i],rows:[{v:String(vals[i]),k:'items started',c:'var(--s1)'}]}));
  return chartCard({title:'New items started per day',sub:live.busy?'Review history is still loading. This shows when you started lessons in the meantime.':'No review history is available for this account, so daily accuracy cannot be shown. This shows when you started lessons.',
    svg:barChart({label:'New items started per day',labels:lab,vals,color:'var(--s1)',tips,xEvery:Math.max(1,Math.ceil(days.length/7))}),
    table:{head:['Date','Items started'],rows:days.map((k,i)=>[k,vals[i]])}});
}
function accuracyCharts(D,compact){
  if(D.noHistory)return lessonsCard(D);
  const days=rangeDays(D);
  const rev=days.map(k=>D.daily[k]?D.daily[k][0]:0);
  const acc=days.map(k=>D.daily[k]&&D.daily[k][0]?100*D.daily[k][1]/D.daily[k][0]:null);
  const avg7=days.map((k,i)=>{let n=0,o=0;for(let j=Math.max(0,i-6);j<=i;j++){const d=D.daily[days[j]];if(d){n+=d[0];o+=d[1]}}return n?100*o/n:null});
  const lab=days.map(k=>new Date(k+'T12:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short'}));
  const ev=Math.max(1,Math.ceil(days.length/7));
  const vals=acc.filter(v=>v!=null),ymin=Math.max(0,Math.floor((Math.min(...vals,100)-5)/10)*10);
  const tipsA=days.map((k,i)=>({title:lab[i],rows:[{v:acc[i]!=null?acc[i].toFixed(1)+'%':'No reviews',k:'that day',c:'var(--ink3)'},{v:avg7[i]!=null?avg7[i].toFixed(1)+'%':'–',k:'7-day average',c:'var(--s2)'}]}));
  const tipsR=days.map((k,i)=>({title:lab[i],rows:[{v:fmtN(rev[i]),k:'reviews',c:'var(--s1)'}]}));
  const cardA=chartCard({title:'Review accuracy per day',sub:'Share of reviews where both meaning and reading were right.',extra:compact?'':rangeSeg(),
    legend:legendLine('var(--ink3)','Daily')+legendLine('var(--s2)','7-day average'),
    svg:lineChart({label:'Review accuracy per day',xs:lab,series:[{vals:acc,color:'var(--ink3)',w:1,op:.8,noDot:true},{vals:avg7,color:'var(--s2)',w:2.5}],ymin,ymax:100,yfmt:v=>Math.round(v)+'%',tips:tipsA,xEvery:ev}),
    table:{head:['Date','Reviews','Accuracy %'],rows:days.map((k,i)=>[k,rev[i],acc[i]!=null?acc[i].toFixed(1):'–'])}});
  if(compact)return cardA;
  const cardR=chartCard({title:'Reviews per day',sub:'',legend:'',
    svg:barChart({label:'Reviews per day',labels:lab,vals:rev,color:'var(--s1)',tips:tipsR,xEvery:ev}),
    table:{head:['Date','Reviews'],rows:days.map((k,i)=>[k,rev[i]])}});
  return cardA+cardR;
}
function forecastCard(D){
  const t=nowS(),mode=S.cfg.fc||'days';
  const items=D.items.filter(i=>i.srs>=1&&i.srs<=8&&i.next);
  const availNow=items.filter(i=>i.next<=t).length;
  const in24=items.filter(i=>i.next>t&&i.next<=t+DAY).length;
  let labs,vals;
  if(mode==='hours'){
    vals=Array(24).fill(0);
    const h0=Math.floor(t/HOUR);
    for(const i of items){if(i.next>t){const h=Math.floor(i.next/HOUR)-h0;if(h>=0&&h<24)vals[h]++}}
    labs=vals.map((_,h)=>new Date((h0+h)*HOUR*1000).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}));
  }else{
    vals=Array(7).fill(0);
    const today=new Date();today.setHours(0,0,0,0);
    for(const i of items){if(i.next>t){const d=new Date(i.next*1000);d.setHours(0,0,0,0);const diff=Math.round((d-today)/86400000);if(diff>=0&&diff<7)vals[diff]++}}
    labs=vals.map((_,k)=>k===0?'Today':k===1?'Tomorrow':new Date(today.getTime()+k*86400000).toLocaleDateString('en-GB',{weekday:'short'}));
  }
  vals=[availNow,...vals];labs=['Now',...labs];
  let run=0;const cum=vals.map(v=>run+=v);
  const tips=vals.map((v,i)=>({title:i===0?'Available now':labs[i],rows:[{v:fmtN(v),k:i===0?'waiting':'coming due',c:'var(--s3)'},{v:fmtN(cum[i]),k:'running total'}]}));
  const age=D.generated&&t-D.generated>HOUR&&S.source!=='sample'?` Based on data from ${new Date(D.generated*1000).toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}. Refresh to include reviews done since.`:'';
  const seg=`<div class="seg" role="group" aria-label="Forecast view">${[['days','7 days'],['hours','24 hours']].map(m=>`<button data-act="fc" data-v="${m[0]}" aria-pressed="${mode===m[0]}">${m[1]}</button>`).join('')}</div>`;
  return chartCard({title:'Review forecast',sub:`${fmtN(availNow)} available now, ${fmtN(in24)} more in the next 24 hours.${age}`,extra:seg,
    svg:barChart({label:'Review forecast',labels:labs,vals,color:'var(--s3)',tips,xEvery:mode==='hours'?3:1}),
    table:{head:['When','Due','Running total'],rows:labs.map((l,i)=>[l,vals[i],cum[i]])}});
}
function levelTimeCard(D,st){
  const t=nowS();
  const rows=D.levels.filter(l=>l.started).map(l=>({lv:l.lv,d:((l.passed||t)-l.started)/DAY,cur:!l.passed}));
  if(!rows.length)return'';
  const avg=st.avg;
  const tips=rows.map(r=>({title:'Level '+r.lv+(r.cur?' (in progress)':''),rows:[{v:r.d.toFixed(1)+' days',k:r.cur?'so far':'to pass',c:'var(--s1)'}]}));
  return chartCard({title:'Level-up time',sub:avg?`Average ${avg.toFixed(1)} days. Dashed line marks the average.`:'',
    svg:barChart({label:'Days spent on each level',labels:rows.map(r=>r.lv),vals:rows.map(r=>r.d),colors:rows.map(r=>r.cur?'var(--ink3)':'var(--s1)'),tips,avg,fmt:v=>Math.round(v)+'d',xEvery:rows.length>30?2:1}),
    table:{head:['Level','Days','Status'],rows:rows.map(r=>[r.lv,r.d.toFixed(1),r.cur?'in progress':'passed'])}});
}
function levelAccCard(D){
  const lv=Object.keys(D.levelAcc).map(Number).sort((a,b)=>a-b);if(!lv.length)return'';
  const vals=lv.map(l=>100*D.levelAcc[l][1]/D.levelAcc[l][0]);

  return chartCard({title:'Accuracy per level',sub:`Lowest: level ${lv[lo]} at ${vals[lo].toFixed(1)}%. Counted per answer from your item totals.`,
    svg:barChart({label:'Answer accuracy per level',labels:lv,vals,colors:vals.map((v,i)=>i===lo?'var(--s3)':'var(--s2)'),max:100,fmt:v=>Math.round(v)+'%',tips,xEvery:lv.length>30?2:1}),
    table:{head:['Level','Answers','Accuracy %'],rows:lv.map((l,i)=>[l,D.levelAcc[l][0],vals[i].toFixed(1)])}});
}
function typeAccCard(D){
  const rows=[];
  for(const t of TY){
    const a=D.items.filter(i=>i.t===t&&i.srs>=1);
    const mc=a.reduce((s,i)=>s+i.mc,0),mi=a.reduce((s,i)=>s+i.mi,0),rc=a.reduce((s,i)=>s+i.rc,0),ri=a.reduce((s,i)=>s+i.ri,0);
    const col=`var(--${t==='r'?'rad':t==='k'?'kan':'voc'})`;
    if(mc+mi)rows.push([TYN[t]+' meaning',pctOf(mc,mc+mi),col]);
    if(rc+ri)rows.push([TYN[t]+' reading',pctOf(rc,rc+ri),col]);
  }
  return`<section class="card"><header><h3>Accuracy by item type</h3><span class="sub">Answer-level accuracy, meaning and reading separately.</span></header>${rows.map(r=>`<div class="mrow"><span>${esc(r[0])}</span>${meterSeg([{v:r[1],w:r[1],c:r[2]}])}<b class="num">${r[1]}%</b></div>`).join('')}</section>`;
}
function srsSplitCard(D){

  const rows=TY.map(t=>{
    const a=D.items.filter(i=>i.t===t&&i.srs>=1),g=[0,0,0,0,0,0];a.forEach(i=>g[stageGroup(i.srs)]++);

  }).join('');

}
function hourCard(D,st){
  const days=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const tips=[];D.hours.forEach((r,d)=>r.forEach((v,h)=>tips.push({title:days[d]+' '+String(h).padStart(2,'0')+':00',rows:[{v:fmtN(v),k:'reviews',c:'var(--s1)'}]})));

    svg:heatChart({label:'Reviews by weekday and hour',grid:D.hours,tips}),

/* How much of each kanji list you know: WaniKani plus what you learned in Extra Kanji. */
function coverageCard(D){
  const wkK=new Set(),exK=new Set();
  for(const i of D.items)if(i.t==='k'&&i.ch&&i.srs>=5)wkK.add(i.ch);
  for(const ch in S.srs)if(S.srs[ch].s>=5&&!wkK.has(ch))exK.add(ch);
  const sections=[
    {h:'Joyo kanji, by school grade',defs:[1,2,3,4,5,6,8].map(g=>({label:g===8?'Secondary school':'Grade '+g,f:k=>k.gr===g}))},
    {h:'JLPT level (old lists)',defs:[5,4,3,2,1].map(n=>({label:'N'+n,f:k=>k.jl===n}))},
    {h:'Newspaper frequency',defs:[0,1,2,3,4].map(b=>({label:'#'+(b*500+1)+' to #'+(b+1)*500,f:k=>k.fq>b*500&&k.fq<=(b+1)*500}))}
  ];
  const body=sections.map(sec=>`<h4 class="subhead">${esc(sec.h)}</h4>`+sec.defs.map(d=>{
    let total=0,wk=0,ex=0,off=0;
    for(const k of ALLK){if(!d.f(k))continue;total++;if(wkK.has(k.ch))wk++;else if(exK.has(k.ch))ex++;if(!(k.wk||D.kanjiSet.has(k.ch)))off++}
    return`<div class="mrow cov"><span>${esc(d.label)}<small class="faint">${off} not on WaniKani</small></span>${meterSeg([{v:wk,w:100*wk/total,c:'var(--kan)'},{v:ex,w:100*ex/total,c:'var(--s1)'}])}<b class="num">${wk+ex} / ${total}</b></div>`;
  }).join('')).join('');
  return`<section class="card"><header><h3>Kanji coverage</h3><span class="sub">Kanji you know at Guru or higher, against each list.</span></header>
    <div class="legend">${legendBox('var(--kan)','Known from WaniKani')}${legendBox('var(--s1)','Learned in Extra Kanji')}</div>${body}
    <p class="hint">Lists overlap, so a kanji can count in more than one group. Open Extra Kanji to study the ones WaniKani does not cover.</p></section>`;
}

/* ---------- Extra Kanji: kanji WaniKani does not teach ---------- */
const wkHas=ch=>!!(S.D&&S.D.kanjiSet&&S.D.kanjiSet.has(ch));
const visibleNew=()=>NEWK.filter(k=>!wkHas(k.ch));
const inSet=k=>{const s=S.cfg.src;return(s.joyo&&k.joyo)||(s.freq&&k.freq)||(s.jlpt&&k.jl>0)};
function sortNew(a){
  const g=k=>k.joyo?k.gr:99;
  if(S.cfg.order==='grade')return a.sort((x,y)=>(g(x)-g(y))||((x.fq||9999)-(y.fq||9999)));
  return a.sort((x,y)=>((x.fq||9999)-(y.fq||9999))||(g(x)-g(y)));
}
const lessonPool=()=>sortNew(visibleNew().filter(k=>inSet(k)&&!S.srs[k.ch]));
const shownList=()=>sortNew(visibleNew().filter(k=>inSet(k)||S.srs[k.ch]));
function xStats(){
  const t=nowS();let started=0,due=0,burned=0,nextAt=null;const groups=[0,0,0,0,0,0];
  for(const ch in S.srs){
    const k=NEW_BY.get(ch);if(!k||wkHas(ch))continue;
    const r=S.srs[ch];started++;groups[stageGroup(r.s)]++;
    if(r.s>=9)burned++;else if(r.n){if(r.n<=t)due++;else if(nextAt==null||r.n<nextAt)nextAt=r.n}
  }
  return{started,due,burned,groups,nextAt,pool:lessonPool(),total:visibleNew().length};
}
function inText(ts){
  const m=Math.max(1,Math.round((ts-nowS())/60));
  return m<60?m+' min':m<48*60?Math.round(m/60)+' h':Math.round(m/1440)+' days';
}
function xFiltered(){

}

function addSynonym(key,val){
  val=(val||'').trim();if(!val)return false;

}

const SYNC_URL=String(window.KANI_SYNC_URL||'').replace(/\/+$/,'');
const SYNCED=new Set(['srs','mnem','mnemT','syn','synT','prac']);
const sync={busy:false,again:false,last:0,err:'',timer:null};
const syncHost=()=>{try{return new URL(SYNC_URL).host}catch(e){return SYNC_URL}};
const syncActive=()=>!!SYNC_URL&&!LS.get('syncoff')&&S.token.trim().length>0&&S.user!=='_guest';
const localDoc=()=>({srs:S.srs,mnem:S.mnem,mnemT:S.mnemT,syn:S.syn,synT:S.synT,prac:S.prac});
const stable=o=>JSON.stringify(o,(k,v)=>v&&typeof v==='object'&&!Array.isArray(v)?Object.keys(v).sort().reduce((a,x)=>(a[x]=v[x],a),{}):v);

/* Merge two copies of the study data. Per item the newer edit wins, so edits on different devices combine. */
function mergeDocs(a,b){
  const out={srs:{},mnem:{},mnemT:{},syn:{},synT:{},prac:{}};
  const keys=(x,y)=>new Set([...Object.keys(x||{}),...Object.keys(y||{})]);
  for(const ch of keys(a.srs,b.srs)){
    const x=(a.srs||{})[ch],y=(b.srs||{})[ch];
    if(!x||!y){out.srs[ch]=x||y;continue}
    const ux=x.u||0,uy=y.u||0;
    out.srs[ch]=ux!==uy?(ux>uy?x:y):((x.c+x.w)>=(y.c+y.w)?x:y);
  }
  for(const [val,ts] of [['mnem','mnemT'],['syn','synT']]){
    for(const k of keys(a[val],b[val])){
      const hx=a[val]&&k in a[val],hy=b[val]&&k in b[val];
      const tx=(a[ts]||{})[k]||0,ty=(b[ts]||{})[k]||0;
      const useA=hx&&(!hy||tx>=ty);
      out[val][k]=useA?a[val][k]:b[val][k];out[ts][k]=useA?tx:ty;
    }
  }
  for(const k of keys(a.prac,b.prac)){
    const x=(a.prac||{})[k],y=(b.prac||{})[k];
    out.prac[k]=!x?y:!y?x:((x[2]||0)>=(y[2]||0)?x:y);
  }
  return out;
}
async function syncFetch(method,body){
  let r;
  try{
    r=await fetch(SYNC_URL+'/data',{method,headers:Object.assign({Authorization:'Bearer '+S.token.trim()},body?{'Content-Type':'application/json'}:{}),body:body?JSON.stringify(body):undefined});
  }catch(e){throw new Error('Could not reach the sync server.')}
  let j=null;try{j=await r.json()}catch(e){}
  if(r.status===401)throw new Error('WaniKani rejected the token, so syncing was skipped.');
  if(j&&j.username&&String(j.username).toLowerCase()!==S.user.toLowerCase())throw new Error('This token belongs to a different WaniKani account. Refresh your WaniKani data first.');
  return{status:r.status,json:j};
}
const syncStatusHtml=()=>sync.err?`<span class="bad">${esc(sync.err)}</span>`:sync.busy?'Syncing…':sync.last?'Last synced '+esc(agoText(sync.last))+'.':syncActive()?'Not synced yet.':LS.get('syncoff')?'Syncing is off.':'Connect to start syncing.';
function syncUi(){const el=$('#syncStatus');if(el)el.innerHTML=syncStatusHtml()}
async function syncNow(){
  if(!syncActive())return;
  if(sync.busy){sync.again=true;return}
  sync.busy=true;sync.err='';syncUi();
  let changed=false;
  try{
    for(let attempt=0;attempt<4;attempt++){
      const g=await syncFetch('GET');
      if(g.status!==200)throw new Error('Sync server answered with error '+g.status+'.');
      const remote=g.json&&g.json.data?g.json:null;
      const local=localDoc();
      const merged=remote?mergeDocs(local,remote.data):local;
      if(stable(merged)!==stable(local)){
        for(const k of SYNCED){S[k]=merged[k];LS.set(ukey(k),S[k])}
        changed=true;
      }
      if(remote&&stable(merged)===stable(remote.data))break;
      if(!remote&&[...SYNCED].every(k=>!Object.keys(local[k]).length))break;
      const p=await syncFetch('PUT',{baseRev:remote?remote.rev:0,data:merged});
      if(p.status===409)continue;
      if(p.status!==200)throw new Error('Sync server answered with error '+p.status+'.');
      break;
    }
    sync.last=nowS();
  }catch(e){sync.err=e.message}
  sync.busy=false;syncUi();
  if(changed)softRender();
  if(sync.again){sync.again=false;syncSoon()}
}
/* Free Cloudflare KV allows about 1,000 writes a day across all users, so keep writes sparse:
   a few seconds after an ordinary edit, but only every 90 seconds while a quiz is running.
   Finishing or quitting a quiz (fast) and hiding the tab both sync straight away. */
function syncSoon(fast){
  if(!syncActive())return;
  if(sync.timer&&!fast)return;
  clearTimeout(sync.timer);
  sync.timer=setTimeout(()=>{sync.timer=null;syncNow()},fast?1500:S.quiz?90000:5000);
}
async function syncDeleteRemote(){
  if(!syncActive())return;
  try{await syncFetch('DELETE')}catch(e){}
}
document.addEventListener('visibilitychange',()=>{
  if(!syncActive())return;
  if(document.visibilityState==='hidden'&&sync.timer){clearTimeout(sync.timer);sync.timer=null;syncNow()}
  else if(document.visibilityState==='visible'&&nowS()-sync.last>300)syncNow();
});
function syncChoiceHtml(){
  if(!SYNC_URL)return'';
  return`<label class="check"><input type="checkbox" id="syncChk"${LS.get('syncoff')?'':' checked'}> Sync my progress across devices</label>
    <p class="hint">Syncing sends your token to the sync server run by this page's author on each sync, only to prove the data is yours. The token is not stored there. Untick to keep everything in this browser.</p>`;
}
function syncCardHtml(){
  if(!SYNC_URL)return`<section class="card"><header><h3>Sync across devices</h3></header><p class="muted">Not set up for this copy of Kani Plus, so your progress is saved in this browser only. Use the backup buttons below to move it to another browser.</p></section>`;
  return`<section class="card"><header><h3>Sync across devices</h3><span class="sub" id="syncStatus">${syncStatusHtml()}</span></header>${syncChoiceHtml()}
    <div class="tools" style="margin-top:8px"><button class="btn" data-act="syncNow"${syncActive()?'':' disabled'}>Sync now</button></div>
    <p class="hint">Your mnemonics, accepted meanings and extra-kanji progress follow your WaniKani username to any browser where you enter your token.</p></section>`;
}

/* ---------- quiz ---------- */
const qMeanings=it=>it.meanings.concat(S.syn[it.key]||[]);
function startQuiz(cfg){
  const qs=[];
  for(const it of cfg.items){qs.push({it,k:'meaning'});if(it.readings.length)qs.push({it,k:'reading'})}
  shuffle(qs);
  S.quiz={cfg,queue:qs,total:qs.length,done:0,phase:'ask',cur:null,last:null,correct:0,wrong:0,finished:[],
    stat:new Map(cfg.items.map(i=>[i.key,{got:0,need:i.readings.length?2:1,slips:0}])),ended:false,nextFn:null};
  S.quiz.cur=S.quiz.queue.shift();renderQuiz();
}
function renderQuiz(){
  const Q=S.quiz,root=$('#quiz');
  if(!Q){root.hidden=true;root.innerHTML='';return}
  root.hidden=false;
  if(Q.ended){
    const slips=Q.finished.filter(f=>f.mistake),nxt=Q.cfg.next?Q.cfg.next():null;
    Q.nextFn=nxt&&nxt.fn;
    root.innerHTML=`<div class="qwrap"><div class="qtop"><b style="flex:1">${esc(Q.cfg.title)} complete</b></div>
      <div class="qsum"><div class="facts"><div class="fact"><b>${Q.finished.length-slips.length} / ${Q.finished.length}</b><span>items with no slips</span></div><div class="fact"><b>${Q.wrong}</b><span>wrong answers along the way</span></div></div>
      ${slips.length?`<section class="card"><header><h3>Needs another look</h3></header><div class="rows">${slips.map(f=>`<div class="row" style="cursor:default">${tile(f.it)}<div class="rmain"><div class="rn">${esc(f.it.meanings.slice(0,4).join(', '))}</div><div class="rr">${esc(f.it.readings.slice(0,4).join('、'))}</div>${S.mnem[f.it.key]?`<div class="why" style="white-space:pre-wrap">${esc(S.mnem[f.it.key])}</div>`:''}</div></div>`).join('')}</div></section>`:'<section class="card"><p>Clean run. Nothing to revisit.</p></section>'}
      <div class="tools">${nxt?`<button class="btn primary" data-act="qnext">${esc(nxt.label)}</button>`:''}<button class="btn${nxt?'':' primary'}" data-act="quitQuiz">Done</button></div></div></div>`;
    return;
  }
  const q=Q.cur,it=q.it,res=Q.phase==='result',last=Q.last;
  const label=q.k==='meaning'?'Meaning':'Reading';
  let fb='';
  if(res){
    const verdict=last.r===2?'Correct':last.r===1?'Close enough, counted as correct':'Not quite';
    let info;
    if(q.k==='meaning')info='Accepted meanings: '+esc(qMeanings(it).slice(0,6).join(', '));
    else if(it.extra)info=`On'yomi: ${esc(it.on.join('、')||'none')} · Kun'yomi: ${esc(it.kun.join('、')||'none')}`;
    else info='Readings: '+esc([...readingSet(it.readings)].slice(0,6).join('、'));
    const syn=(q.k==='meaning'&&!last.r&&last.shown.trim())?`<div><button class="btn sm" data-act="addSyn" style="margin-top:8px">My answer was right: accept “${esc(last.shown.trim())}”</button></div>`:'';
    const note=it.extra||!last.r||S.mnem[it.key];
    fb=`<div class="qfb"><b class="${last.r?'okt':'bad'}">${verdict}</b><div class="muted" style="margin-top:4px">${info}</div>${last.r?'':'<div class="faint" style="margin-top:4px">You will see this one again shortly.</div>'}${syn}${note?`<div style="margin-top:10px">${mnemHtml(it.key,!!it.extra,2)}</div>`:''}</div>`;
  }
  const hint=q.k==='reading'&&it.extra?` <span class="faint">on'yomi or kun'yomi</span>`:'';
  root.innerHTML=`<div class="qwrap"><div class="qtop"><button class="btn sm" data-act="quitQuiz">Quit</button>${meterSeg([{v:Q.done,w:100*Q.done/Q.total,c:'var(--good)'}])}<span class="num muted">${Q.done}/${Q.total}</span></div>
    <div class="qmeta"><span class="muted">${esc(Q.cfg.label)}</span><span class="tag ${Q.cfg.badgeClass||'name'}">${esc(Q.cfg.badge||'')}</span></div>
    <div class="qcard t-${it.t}"><div class="qchar">${esc(it.ch)}</div></div>
    <div class="qprompt">${TYN[it.t]} <b>${label}</b>${hint}</div>
    <form class="qform" id="qform" autocomplete="off"><input id="qa" type="text" inputmode="text" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="${q.k==='reading'?'ここに答え':'Your response'}" aria-label="${label} answer" class="${res?(last.r?'ok':'no'):''}"${res?' readonly':''} value="${res?esc(last.shown):''}"><button type="submit" aria-label="${res?'Continue':'Submit'}" title="${res?'Continue (Enter)':'Submit (Enter)'}">→</button></form>${fb}</div>`;
  const inp=$('#qa');inp.focus();
  if(!res&&q.k==='reading')inp.addEventListener('input',()=>{const v=toKana(inp.value,false);if(v!==inp.value)inp.value=v});
}
function gotRight(Q,it,st){
  st.got++;Q.correct++;Q.done++;
  if(st.got>=st.need){Q.cfg.onItem(it,st.slips>0);Q.finished.push({it,mistake:st.slips>0})}
}
function answerQ(){
  const Q=S.quiz,q=Q.cur,it=q.it,val=$('#qa').value;
  if(!val.trim())return;
  const r=q.k==='meaning'?checkMeaning(val,qMeanings(it)):checkReading(val,it.readings);
  const st=Q.stat.get(it.key);
  Q.last={r,shown:q.k==='reading'?toKana(val,true):val};Q.phase='result';
  if(r)gotRight(Q,it,st);
  else{st.slips++;Q.wrong++;Q.queue.splice(Math.min(Q.queue.length,2+Math.floor(Math.random()*3)),0,q)}
  renderQuiz();
}
/* "My answer was right": store it as an accepted meaning and undo the miss */
function overrideAsRight(){
  const Q=S.quiz;if(!Q||Q.phase!=='result'||Q.last.r)return;
  const q=Q.cur,it=q.it;if(q.k!=='meaning')return;
  if(!addSynonym(it.key,Q.last.shown))return;
  const st=Q.stat.get(it.key);st.slips--;Q.wrong--;
  const idx=Q.queue.indexOf(q);if(idx>=0)Q.queue.splice(idx,1);
  Q.last.r=2;gotRight(Q,it,st);renderQuiz();
}
function nextQ(){
  const Q=S.quiz;
  if(!Q.queue.length){Q.ended=true;renderQuiz();syncSoon(true);return}
  Q.cur=Q.queue.shift();Q.phase='ask';Q.last=null;renderQuiz();
}
document.addEventListener('submit',e=>{
  if(e.target.id!=='qform')return;e.preventDefault();
  S.quiz.phase==='result'?nextQ():answerQ();
});
function quitQuiz(){flushAll();S.quiz=null;renderQuiz();render();syncSoon(true)}

/* ---------- accounts: all saved study data is keyed by WaniKani username ---------- */
function switchUser(name){
  S.user=name;
  if(name!=='_guest'){
    /* progress made before connecting moves over to the first account that connects */
    for(const d of DOCS){
      const g='u:_guest:'+d,u='u:'+name+':'+d;
      if(LS.get(u)==null&&LS.get(g)!=null){LS.set(u,LS.get(g));LS.del(g)}
    }
  }
  S.srs=LS.get(ukey('srs'))||{};S.mnem=LS.get(ukey('mnem'))||{};S.mnemT=LS.get(ukey('mnemT'))||{};
  S.syn=LS.get(ukey('syn'))||{};S.synT=LS.get(ukey('synT'))||{};S.prac=LS.get(ukey('prac'))||{};
  const c=LS.get(ukey('cfg'))||{};
  S.cfg=Object.assign(defaultCfg(),c);S.cfg.src=Object.assign({joyo:true,freq:true,jlpt:true},c.src||{});
  S.sel.clear();S.lesson=null;
}
function migrateLegacy(){
  for(const n of ['srs','prac','mnem','cfg']){
    const old=LS.get(n);
    if(old&&typeof old.s==='string'&&LS.get('u:_guest:'+n)==null){try{LS.set('u:_guest:'+n,JSON.parse(old.s))}catch(e){}}
    if(old&&typeof old.s==='string')LS.del(n);
  }
}
function setCfg(k,v){S.cfg[k]=v;persistLater('cfg',()=>S.cfg);render()}

/* ---------- shell and routing ---------- */
function render(){
  const app=$('#app');
  $$('.tabs a').forEach(a=>a.setAttribute('aria-current',a.dataset.r===S.route?'page':'false'));
  renderChip();
  if(S.loading){app.innerHTML='<section class="card"><p class="muted">Loading…</p></section>';return}
  let html;
  if(NEEDS_DATA.includes(S.route)&&!S.D)html=viewWelcome();
  else html={dashboard:viewDashboard,watchlist:viewWatch,practice:viewPractice,'extra-kanji':viewExtra,stats:viewStats,settings:viewSettings}[S.route]();
  app.innerHTML=html;
}
function route(){
  let h=location.hash.replace('#','');
  if(h==='new-kanji')h='extra-kanji';
  if(h==='connect')h='settings';
  S.route=ROUTES.includes(h)?h:'dashboard';
  if(S.route!=='extra-kanji')S.lesson=null;
  render();
}
addEventListener('hashchange',()=>{route();scrollTo(0,0)});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&!$('#modal').hidden)closeModal();
  if(e.key==='Enter'&&e.target.id==='synIn'){e.preventDefault();const b=$('[data-act="addSynModal"]');if(b)b.click()}
  if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)&&e.target.dataset&&e.target.dataset.mn!==undefined&&S.quiz&&S.quiz.phase==='result'){e.preventDefault();nextQ()}
});

/* ---------- events ---------- */
function refreshPers(key){const p=$('#pers');if(p)p.innerHTML=mnemHtml(key,key[0]==='n',3)+`<div style="margin-top:12px">${synHtml(key)}</div>`}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');
  if(!el){if(e.target.id==='modal')closeModal();return}
  const d=el.dataset,a=d.act;
  if(a==='sel'){const id=+d.id;e.target.checked?S.sel.add(id):S.sel.delete(id);const bar=$('.selbar');if(S.route==='watchlist'){const had=!!bar;if(had!==!!S.sel.size)render();else if(bar)bar.outerHTML=selBar()}return}
  if(e.target.closest('.chk'))return;
  switch(a){
    case'tbl':{const c=el.closest('.card'),on=el.getAttribute('aria-pressed')==='true';el.setAttribute('aria-pressed',!on);el.textContent=on?'Table':'Chart';$('.cv',c).hidden=!on;$('.tbl',c).hidden=on;break}
    case'cat':S.watch.cat=d.cat;S.watch.limit=40;if(location.hash!=='#watchlist')location.hash='#watchlist';else render();break;
    case'wtype':S.watch.type=d.t;S.watch.limit=40;render();break;
    case'wmore':S.watch.limit+=40;$('#wlist').innerHTML=watchListHtml();break;
    case'selTop':watchItems().slice(0,15).forEach(i=>S.sel.add(i.id));render();break;
    case'clearSel':S.sel.clear();render();break;
    case'open':openItem(d.id);break;
    case'closeModal':closeModal();break;
    case'practiceCat':startPractice(S.D.cats[d.cat].items);break;
    case'practiceSel':startPractice([...S.sel].map(id=>S.D.by.get(id)).filter(Boolean));break;
    case'practiceOne':closeModal();startPractice([S.D.by.get(+d.id)]);break;
    case'size':setCfg('size',+d.n);break;
    case'range':setCfg('range',+d.n);break;
    case'fc':setCfg('fc',d.v);break;
    case'goExtra':location.hash='#extra-kanji';break;
    case'xsrc':{const s=S.cfg.src,on=Object.values(s).filter(Boolean).length;if(s[d.k]&&on===1){toast('Keep at least one list selected.');break}s[d.k]=!s[d.k];setCfg('src',s);break}
    case'xorder':S.xlimit=90;setCfg('order',d.v);break;
    case'xbatch':setCfg('batch',+d.n);break;
    case'xrsize':setCfg('rsize',+d.n);break;
    case'xview':setCfg('view',d.v);break;
    case'xstatus':S.xlimit=90;setCfg('status',d.v);break;
    case'xmore':S.xlimit+=90;softRefreshList();break;
    case'hideIntro':setCfg('hideIntro',true);break;
    case'showIntro':setCfg('hideIntro',false);break;
    case'startLessons':startLessons();break;
    case'startReviews':startNewReviews();break;
    case'lessonNext':S.lesson.i++;render();scrollTo(0,0);break;
    case'lessonPrev':S.lesson.i--;render();scrollTo(0,0);break;
    case'lessonQuiz':startLessonQuiz();break;
    case'lessonKnow':{
      const L=S.lesson,k=L.items[L.i];S.srs[k.ch]={s:5,n:nowS()+SRS_HOURS[5]*HOUR,c:0,w:0,u:nowS()};persistLater('srs',()=>S.srs);
      L.items.splice(L.i,1);
      if(!L.items.length){S.lesson=null;toast('Marked as known. That was the last one in this lesson.')}else if(L.i>=L.items.length)L.i=L.items.length-1;
      render();scrollTo(0,0);break}
    case'endLesson':S.lesson=null;render();break;
    case'nopen':openNew(d.ch);break;
    case'learnNow':closeModal();startLessons([NEW_BY.get(d.ch)]);break;
    case'knowKanji':S.srs[d.ch]={s:5,n:nowS()+SRS_HOURS[5]*HOUR,c:0,w:0,u:nowS()};persistLater('srs',()=>S.srs);closeModal();render();break;
    case'resetKanji':S.srs[d.ch]={s:1,n:nowS(),c:0,w:0,u:nowS()};persistLater('srs',()=>S.srs);closeModal();render();toast('Restarted at Apprentice 1. It is due for review now.');break;
    case'addSyn':overrideAsRight();break;
    case'addSynModal':{const inp=$('#synIn');if(addSynonym(d.key,inp.value))refreshPers(d.key);break}
    case'delSyn':{const arr=S.syn[d.key]||[];arr.splice(+d.i,1);S.syn[d.key]=arr;S.synT[d.key]=nowS();persistLater('syn',()=>S.syn);persistLater('synT',()=>S.synT);refreshPers(d.key);break}
    case'quitQuiz':quitQuiz();break;
    case'qnext':{const f=S.quiz&&S.quiz.nextFn;flushAll();S.quiz=null;renderQuiz();syncSoon(true);if(f)f();else render();break}
    case'connectLive':{const t=($('#tokIn').value||'').trim();if(!t){toast('Paste your token first.');break}S.token=t;LS.set('token',{t});refreshLive(true);break}
    case'refresh':refreshLive(true);break;
    case'syncNow':flushAll();syncNow();break;
    case'forgetToken':S.token='';LS.del('token');render();toast('Token forgotten. Your saved data is untouched.');break;
    case'useSample':S.D=parseSnapshot(makeSample());S.source='sample';S.importedAt=null;render();break;
    case'exportBackup':{
      flushAll();
      const data={kaniPlus:1,user:S.user,exported:nowS(),srs:S.srs,mnem:S.mnem,mnemT:S.mnemT,syn:S.syn,synT:S.synT,prac:S.prac,cfg:S.cfg};
      const blob=new Blob([JSON.stringify(data)],{type:'application/json'}),url=URL.createObjectURL(blob);
      const link=document.createElement('a');link.href=url;link.download='kani-plus-backup-'+(S.user==='_guest'?'guest':S.user)+'.json';
      document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);break}
    case'wipe':{
      if(!S.armed){S.armed=true;render();setTimeout(()=>{if(S.armed){S.armed=false;if(S.route==='settings')render()}},5000);break}
      S.armed=false;Object.keys(pending).forEach(k=>{delete pending[k];clearTimeout(timers[k])});
      const wasSyncing=syncActive();
      for(const dd of [...DOCS,'snap'])LS.del(ukey(dd));
      S.srs={};S.mnem={};S.mnemT={};S.syn={};S.synT={};S.prac={};S.cfg=defaultCfg();S.D=null;S.raw=null;S.source='none';S.importedAt=null;
      if(wasSyncing)syncDeleteRemote();
      toast(wasSyncing?'Saved data deleted here and on the sync server.':'Saved data deleted.');render();break}
  }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='wq'){S.watch.q=t.value;S.watch.limit=40;clearTimeout(S._wq);S._wq=setTimeout(()=>{const l=$('#wlist');if(l)l.innerHTML=watchListHtml()},120)}
  else if(t.id==='xq'){S.xq=t.value;S.xlimit=90;clearTimeout(S._xq);S._xq=setTimeout(softRefreshList,120)}
  else if(t.dataset&&t.dataset.mn!==undefined){
    /* an emptied note is kept as an empty string with a timestamp, so the deletion also reaches other devices */
    const k=t.dataset.mn;S.mnem[k]=t.value.trim()?t.value:'';S.mnemT[k]=nowS();
    persistLater('mnem',()=>S.mnem);persistLater('mnemT',()=>S.mnemT);
  }
});
document.addEventListener('change',e=>{
  if(e.target.id==='syncChk'){
    if(e.target.checked){LS.del('syncoff');syncNow()}else LS.set('syncoff',true);
    if(S.route==='settings')render();
    return;
  }
  if(e.target.id!=='backupIn'||!e.target.files[0])return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const j=JSON.parse(r.result);if(j.kaniPlus!==1)throw new Error('x');
      const t=nowS();
      for(const ch in j.srs||{})S.srs[ch]=Object.assign({},j.srs[ch],{u:t});
      for(const k in j.mnem||{}){S.mnem[k]=j.mnem[k];S.mnemT[k]=t}
      for(const k in j.syn||{}){const a=S.syn[k]||(S.syn[k]=[]);let add=false;for(const v of j.syn[k])if(!a.includes(v)){a.push(v);add=true}if(add)S.synT[k]=t}
      Object.assign(S.prac,j.prac||{});
      for(const n of ['srs','mnem','mnemT','syn','synT','prac'])persistLater(n,()=>S[n]);flushAll();
      toast('Backup restored.');render();
    }catch(err){toast('That file is not a Kani Plus backup.')}
  };
  r.readAsText(e.target.files[0]);
});

/* ---------- start ---------- */
function boot(){
  S.token=(LS.get('token')||{}).t||'';
  migrateLegacy();
  switchUser(LS.get('last')||'_guest');
  const snap=LS.get(ukey('snap'));
  if(snap){try{S.D=parseSnapshot(snap);S.raw=snap;S.source='import';S.importedAt=snap.generated}catch(e){S.D=null}}
  S.loading=false;route();
  if(S.token.trim()&&(!S.D||S.source!=='import'||nowS()-(S.importedAt||0)>30*60))refreshLive(false);
  else syncNow();
}
boot();

</script>
